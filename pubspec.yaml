name: kala_ai_create_images_videos_with_ai
description: Create Images & Videos with AI
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  pro_image_editor: ^14.11.0
  flutter_riverpod: ^2.0.0
  flutter_local_notifications: ^19.5.0

  # HTTP + file handling
  http: ^1.1.0
  dio: ^5.0.0             # optional: multipart, progress
  image: ^4.0.17          # for local transformations if needed
  bot_toast: ^4.1.0
  gal: ^2.3.2
  open_filex: ^4.7.0
  crypto: ^3.0.6
  file_picker: ^10.2.1
  image_background_remover: ^1.0.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  tflite_flutter: ^0.11.0
  google_mlkit_selfie_segmentation: ^0.10.1
  url_launcher: ^6.3.2
  share_plus: '>=10.1.4 <11.0.0'
  webview_flutter: ^4.4.2
  connectivity_plus: ^7.0.0 
  path_provider: ^2.1.5
  flutter_colorpicker: ^1.1.0
  permission_handler: ^11.1.0
  device_info_plus: ^9.1.0
  package_info_plus: ^8.0.0


  # Auth + backend 2.12.0
  supabase_flutter: ^2.9.1

  # Ads & monetization
  google_mobile_ads: ^7.0.0

  # Storage / persisted state
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  google_fonts: ^6.3.0
  lucide_icons_flutter: ^3.1.25
  shared_preferences: ^2.3.0
  fluttertoast: ^8.2.5
  file_saver: ^0.3.1
  shimmer: ^3.0.0
    # UI helpers  firebase_core: ^4.3.0     google_sign_in: ^7.2.0     firebase_auth: ^6.1.3      firebase_messaging: ^16.1.0   firebase_storage: ^13.0.5   

  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_storage: ^13.0.5
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.2
  in_app_purchase: ^3.2.0
  vibration: ^3.1.1

  # Video-Editing
  pro_video_editor: ^2.0.0
  ffmpeg_kit_flutter_new: ^4.1.0
  animated_text_kit: ^4.3.0
  video_thumbnail: ^0.5.3  # For extracting thumbnails from videos

  ### Choose one player below
  video_player: ^2.10.0
  audio_service: ^0.18.18
  # chewie: ^1.12.1
  # flick_video_player: ^0.9.0
  media_kit: ^1.2.0 # Primary package.
  media_kit_video: ^1.3.0 # For video rendering.
  media_kit_libs_video: ^1.0.6 # Native video dependencies.
  uuid: ^4.5.2
  flutter_animate: ^4.5.2
  animations: ^3.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/kala_ai_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/kala_ai_logo.png"
  # iOS specific
  remove_alpha_ios: true
  # Android notification icon (monochrome/white for status bar)
  android_notification_icon:
    image_path: "assets/kala_ai_logo_monochrome.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/kala_ai_logo.png
    - assets/kala_ai_logo_monochrome.png
    - assets/models/
    - assets/fonts/
    - lib/features/studio/workflows/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
