name: image_vid_gen_edit_frontend
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  pro_image_editor: ^11.10.1
  flutter_riverpod: ^2.0.0
  flutter_local_notifications: ^19.5.0

  # HTTP + file handling
  http: ^1.1.0
  dio: ^5.0.0             # optional: multipart, progress
  image: ^4.0.17          # for local transformations if needed
  bot_toast: ^4.1.0
  gal: ^2.3.2
  open_filex: ^4.7.0
  crypto: ^3.0.6
  file_picker: ^10.2.1
  image_background_remover: ^1.0.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0 
  path_provider: ^2.1.5
  flutter_colorpicker: ^1.1.0

  # Auth + backend
  supabase_flutter: ^2.9.1

  # Ads & monetization
  google_mobile_ads: ^4.0.0

  # Storage / persisted state
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI helpers
  google_fonts: ^6.3.0
  lucide_icons: ^0.257.0
  shared_preferences: ^2.3.0
  fluttertoast: ^8.2.5
  file_saver: ^0.3.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.3 
  firebase_storage: ^13.0.1

  vibration: ^3.1.1

  # Video-Editing
  pro_video_editor: ^0.2.3
  animated_text_kit: ^4.3.0

  ### Choose one player below
  video_player: ^2.10.0
  # chewie: ^1.12.1
  # flick_video_player: ^0.9.0
  media_kit: ^1.2.0 # Primary package.
  media_kit_video: ^1.3.0 # For video rendering.
  media_kit_libs_video: ^1.0.6 # Native video dependencies.



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sample.jpg
